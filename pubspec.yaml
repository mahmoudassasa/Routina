name: routina
description: A beautiful habit tracker app with clean design
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter

  intl: any

  # ----- State Management -----
  flutter_bloc: ^8.1.5

  # ----- UI / Icons / Screen Adaptation -----
  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.3   # Responsive screen & font scaling
  flutter_svg: ^2.2.3
  google_fonts: ^6.0.0
  image_picker: ^1.2.1
  shimmer: ^3.0.0
  # ----- Firebase Core Services -----
  firebase_core: ^4.2.0         # Core Firebase initialization
  firebase_auth: ^6.1.1         # Authentication services
  cloud_firestore: ^6.1.0       # Firestore database
  firebase_app_installations: ^0.4.0+3   # Firebase installation identifiers

  # ----- Storage -----
  shared_preferences: ^2.3.2   # Key-value storage
  flutter_secure_storage: ^9.0.0 # Encrypted storage for sensitive data
  firebase_app_check: ^0.4.1+2
  supabase_flutter: ^2.10.3
  equatable: ^2.0.7

# ----- Services -----
  csv: ^6.0.0
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.0
  flutter_local_notifications: ^20.0.0
  flutter_timezone: ^5.0.0
  timezone: ^0.10.0
  flutter_launcher_icons: ^0.14.4
  url_launcher: ^6.3.2
  connectivity_plus: ^6.1.4
  internet_connection_checker_plus: ^2.5.1
  get_it: ^9.2.1
  package_info_plus: ^8.1.2
  google_sign_in: ^6.2.1
  in_app_purchase: ^3.2.0
  flutter_localizations:
    sdk: flutter





dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints / Code Quality
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true


  assets:
    - assets/images/
    - assets/icons/
    - .env

  