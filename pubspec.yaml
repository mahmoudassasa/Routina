name: routina
description: A beautiful habit tracker app with clean design
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ----- State Management -----
  flutter_bloc: ^8.1.5

  # ----- UI / Icons / Screen Adaptation -----
  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.3   # Responsive screen & font scaling

  # ----- Firebase Core Services -----
  firebase_core: ^4.2.0         # Core Firebase initialization
  firebase_auth: ^6.1.1         # Authentication services
  cloud_firestore: ^6.1.0       # Firestore database
  firebase_app_installations: ^0.4.0+3   # Firebase installation identifiers

  # ----- Local Storage -----
  shared_preferences: ^2.3.2   # Key-value storage
  flutter_secure_storage: ^9.0.0 # Encrypted storage for sensitive data
  firebase_app_check: ^0.4.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints / Code Quality
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
